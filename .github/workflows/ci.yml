name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        # -m "not network": the whole suite runs against the deterministic
        # synthetic provider, so CI never depends on an external data vendor.
        run: pytest -m "not network" --cov=earnings_engine --cov-report=term-missing

      - name: End-to-end demo
        run: python -m earnings_engine.cli demo --out reports/demo --quiet

      - name: Rolling annual holdouts, with the null control
        # The null run is the point: if the pipeline finds a result in data
        # with no effect planted in it, everything else is an artefact.
        run: |
          python -m earnings_engine.cli holdout --out reports/holdout --quiet
          python -m earnings_engine.cli holdout --drift 0 --out reports/holdout_null --quiet

      - name: Reproducibility check
        # Re-runs every published number and diffs SHA-256 against the
        # committed manifest, so non-determinism cannot creep in unnoticed.
        if: matrix.python-version == '3.12'
        run: python scripts/reproduce.py --check

      - name: Upload reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
