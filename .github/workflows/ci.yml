name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        # -m "not network": the whole suite runs against the deterministic
        # synthetic provider, so CI never depends on an external data vendor.
        run: pytest -m "not network" --cov=earnings_engine --cov-report=term-missing

      - name: End-to-end demo
        run: python -m earnings_engine.cli demo --out reports/demo --quiet

      - name: Upload demo artefacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: reports/demo
