name: Publish dashboard

# Rebuilds the holdout study on every push to main and publishes the
# dashboard to GitHub Pages, so the result is a URL rather than a clone.
# Requires Pages to be enabled once: Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build the holdout study
        run: |
          python -m earnings_engine.cli holdout --out reports/holdout --quiet
          python -m earnings_engine.cli holdout --drift 0 --out reports/holdout_null --quiet

      - name: Assemble the site
        run: |
          mkdir -p site/null
          # The explainer is the landing page: most visitors want to know what
          # the project found before they want the diagnostics.
          cp reports/holdout/explainer.html      site/index.html
          cp reports/holdout/dashboard.html      site/dashboard.html
          cp reports/holdout_null/dashboard.html site/null/index.html
          cp reports/holdout/report.md           site/report.md
          cp -r reports/holdout/figures          site/figures

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
